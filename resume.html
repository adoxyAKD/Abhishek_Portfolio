    --bg-elev: #FFFFFF;
    --surface: #FFFFFF;
    --surface-line: #DEE4EC;
    --ink: #101826;
    --ink-dim: #4C5C70;
    --ink-faint: #8092A6;
    --header-bg: rgba(244,246,249,0.78);
    --shadow-med: rgba(20,30,45,0.1);
    --flutter: #0A7EA8;
    --dart: #2C5FB0;
    --amber: #B4650F;
    --green: #128A54;

  html{ transition: background-color .35s ease; }
  body, header, section, footer{ transition: background-color .35s ease, border-color .35s ease, color .35s ease, box-shadow .35s ease; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; max-width:100%; overflow-x:hidden; }
  body{
    background:var(--bg); color:var(--ink); font-family:'Inter', sans-serif;

  ::selection{ background:var(--flutter); color:#04121C; }
  a{ color:inherit; text-decoration:none; }
  h1,h2,h3,h4{ font-family:'Space Grotesk', sans-serif; letter-spacing:-0.02em; }
  .mono{ font-family:'JetBrains Mono', monospace; }
  .wrap{ max-width:980px; margin:0 auto; padding:0 32px; }
  @media (max-width:640px){ .wrap{ padding:0 20px; } }

  body::before{
    content:""; position:fixed; inset:0;
    background-image:
      linear-gradient(var(--surface-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--surface-line) 1px, transparent 1px);
    background-size:64px 64px; opacity:0.06; pointer-events:none; z-index:0;
  }
  .ambient-layer{ position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  .ambient-orb{ position:absolute; border-radius:50%; filter:blur(90px); opacity:0.14; }
  .ambient-orb.o1{ width:480px; height:480px; top:-8%; right:-8%; background:radial-gradient(circle, var(--flutter), transparent 70%); }
  .ambient-orb.o2{ width:420px; height:420px; bottom:-6%; left:-8%; background:radial-gradient(circle, var(--dart), transparent 70%); }

  /* ---------- PAGE TRANSITIONS ---------- */
  body{ animation:pageEnter .5s cubic-bezier(.16,.84,.44,1) both; }
  @keyframes pageEnter{ from{ opacity:0; transform:scale(.985) translateY(10px); filter:blur(4px); } to{ opacity:1; transform:none; filter:blur(0); } }
  body.page-exit{ animation:pageExitOut .38s cubic-bezier(.4,0,.2,1) forwards; }
  @keyframes pageExitOut{ to{ opacity:0; transform:scale(.985) translateY(-8px); filter:blur(4px); } }
  @media (prefers-reduced-motion: reduce){ body{ animation:none; } body.page-exit{ animation:none; } }

  /* ---------- HEADER ---------- */
  header{
    position:sticky; top:0; z-index:50; backdrop-filter:blur(14px);
    background:var(--header-bg); border-bottom:1px solid var(--surface-line);
  }
  nav{ display:flex; align-items:center; justify-content:space-between; padding:16px 32px; max-width:980px; margin:0 auto; gap:14px; }
  @media (max-width:640px){ nav{ padding:14px 20px; } }
  .logo{ font-weight:700; font-size:16px; display:flex; align-items:center; gap:8px; white-space:nowrap; }
  .logo .dot{ width:9px; height:9px; border-radius:50%; background:var(--flutter); box-shadow:0 0 12px var(--flutter); }
  .nav-actions{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:flex-end; }

  .btn{
    display:inline-flex; align-items:center; gap:7px; padding:10px 16px; border-radius:10px;
    font-size:13.5px; font-weight:600; border:none; cursor:pointer; white-space:nowrap;
    transition:transform .18s ease, box-shadow .18s ease, border-color .2s ease, background .2s ease, color .2s ease;
  }
  .btn-primary{ background:var(--flutter); color:#052032; box-shadow:0 8px 24px rgba(19,185,253,0.25); }
  .btn-primary:hover{ transform:translateY(-2px); box-shadow:0 12px 28px rgba(19,185,253,0.35); }
  .btn-ghost{ border:1px solid var(--surface-line); color:var(--ink); background:transparent; }
  .btn-ghost:hover{ border-color:var(--flutter); color:var(--flutter); transform:translateY(-2px); }

  .theme-toggle{
    width:38px; height:38px; border-radius:10px; flex-shrink:0;
    border:1px solid var(--surface-line); background:var(--surface); color:var(--ink);
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px;
    transition:border-color .2s ease, transform .2s ease, background .2s ease;
  }
  .theme-toggle:hover{ border-color:var(--flutter); transform:translateY(-2px); }


  /* body: use clip (not hidden) so sticky elements keep working */

  /* ---------- PAGE INTRO ---------- */
  .r-hero{ position:relative; z-index:1; padding-block:40px 22px; }
  .r-eyebrow{
    display:inline-flex; align-items:center; gap:8px; font-family:'JetBrains Mono', monospace; font-size:12px;

  }
  .r-hero h1{ font-size:clamp(26px,4.2vw,38px); font-weight:700; line-height:1.15; }
  .r-hero .role{ margin-top:8px; font-size:15.5px; color:var(--ink-dim); max-width:680px; }
  .r-hero .role b{ color:var(--ink); font-weight:600; }

  /* ---------- SEARCH BAR (sticky) ---------- */
  .rs-bar{
    position:sticky; top:var(--hdr-h,69px); z-index:40; padding-block:10px;
    background:color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--surface-line);
  }
  .rs-row{ display:flex; align-items:center; gap:8px; }
  .rs-field{
    flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:8px; height:44px; padding:0 12px;
    background:var(--surface); border:1px solid var(--surface-line); border-radius:12px;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  .rs-field:focus-within{ border-color:var(--flutter); box-shadow:0 0 0 3px rgba(19,185,253,.16); }
  .rs-field svg{ flex-shrink:0; color:var(--ink-faint); }
  .rs-input{
    flex:1 1 auto; min-width:0; height:100%; background:transparent; border:0; outline:0;
    color:var(--ink); font:500 14.5px 'Inter',sans-serif;
  }
  .rs-input::placeholder{ color:var(--ink-faint); }
  .rs-input::-webkit-search-cancel-button{ display:none; }
  .rs-count{ flex-shrink:0; font:500 12px 'JetBrains Mono',monospace; color:var(--ink-dim); white-space:nowrap; }
  .rs-count.none{ color:var(--amber); }
  .ibtn{
    width:44px; height:44px; flex-shrink:0; border-radius:12px; cursor:pointer; font-size:15px;
    border:1px solid var(--surface-line); background:var(--surface); color:var(--ink);
    display:flex; align-items:center; justify-content:center; touch-action:manipulation;
    transition:border-color .2s ease, color .2s ease, opacity .2s ease, background .2s ease;
  }
  .ibtn:hover:not(:disabled){ border-color:var(--flutter); color:var(--flutter); }
  .ibtn:disabled{ opacity:.4; cursor:default; }
  .rs-clear{ width:28px; height:28px; border-radius:8px; border:0; background:transparent; color:var(--ink-faint); cursor:pointer; font-size:15px; display:none; }
  .rs-clear:hover{ color:var(--ink); background:var(--surface-line); }
  .has-q .rs-clear{ display:block; }

  .rs-tools{ position:relative; z-index:1; display:flex; align-items:center; flex-wrap:wrap; gap:10px 14px; padding-block:14px 6px; }
  .rs-chips{ display:flex; align-items:center; gap:8px; flex:1 1 360px; min-width:0; overflow-x:auto; scrollbar-width:none; padding:2px 0; }
  .rs-chips::-webkit-scrollbar{ display:none; }
  .rs-chips .lbl{ font:500 11px 'JetBrains Mono',monospace; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.08em; flex-shrink:0; }
  .kchip{
    flex-shrink:0; font:500 12.5px 'Inter',sans-serif; padding:6px 12px; border-radius:100px; cursor:pointer;
    color:var(--ink-dim); background:var(--surface); border:1px solid var(--surface-line); touch-action:manipulation;
    transition:border-color .2s ease, color .2s ease, background .2s ease;
  }
  .kchip:hover{ border-color:rgba(19,185,253,.5); color:var(--flutter); }
  .kchip.on{ border-color:var(--flutter); color:var(--flutter); background:rgba(19,185,253,.10); }

  .zoom button:hover:not(:disabled){ color:var(--flutter); background:rgba(19,185,253,.08); }
  .zoom button:disabled{ opacity:.35; cursor:default; }
  .zoom span{ min-width:46px; text-align:center; font:500 12px 'JetBrains Mono',monospace; color:var(--ink-dim); }
  .paper-btn{
    height:34px; padding:0 12px; border-radius:10px; cursor:pointer; font:600 12.5px 'Inter',sans-serif;
    border:1px solid var(--surface-line); background:var(--surface); color:var(--ink); touch-action:manipulation;
    transition:border-color .2s ease, color .2s ease;
  }
  .paper-btn:hover{ border-color:var(--flutter); color:var(--flutter); }
  .paper-btn[aria-pressed="true"]{ border-color:var(--flutter); color:var(--flutter); background:rgba(19,185,253,.10); }

  /* ---------- PDF PAGES ---------- */
  .viewer{ position:relative; z-index:1; padding-block:14px 36px; }
  .pages-scroll{ overflow-x:auto; padding:6px 2px 18px; -webkit-overflow-scrolling:touch; }
  .pages{ margin:0 auto; display:flex; flex-direction:column; gap:22px; align-items:center; }
  .pg{
    position:relative; background:#fff; border-radius:8px; overflow:hidden; flex-shrink:0;
    border:1px solid var(--surface-line);
    box-shadow:0 18px 50px var(--shadow-med), 0 0 0 1px rgba(255,255,255,.02), 0 0 46px rgba(19,185,253,.07);
  }
  .pg canvas{ display:block; }

  /* ---------- CARD EFFECTS — identical to the portfolio cards (.project-card) ---------- */
  .pg{
    border-radius:var(--radius); top:0;
    transition:transform .3s ease, border-color .25s ease, box-shadow .25s ease;
    transform-style:preserve-3d; will-change:transform;
    animation:pgIn .7s cubic-bezier(.16,.84,.44,1) backwards, cardDrift 6s ease-in-out .7s infinite;
  }
  .pg:nth-child(2){ animation-delay:.15s, 1.4s; }
  .pg:hover{ border-color:rgba(19,185,253,0.4); box-shadow:0 20px 40px rgba(5,10,18,0.4); }
  .pg::before{
    content:""; position:absolute; inset:0; z-index:5; border-radius:var(--radius); pointer-events:none;
    background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%), rgba(19,185,253,0.14), transparent 60%);
    opacity:0; transition:opacity .3s ease;
  }
  .pg:hover::before{ opacity:1; }
  .pg:not(.skeleton)::after{
    content:""; position:absolute; top:0; left:-40%; width:40%; height:2px; z-index:6; pointer-events:none;
    background:linear-gradient(90deg, transparent, var(--flutter), transparent);
    animation:sweep 6s ease-in-out infinite;
  }
  @keyframes sweep{ 0%{ left:-40%; } 50%{ left:100%; } 100%{ left:100%; } }
  @keyframes cardDrift{ 0%,100%{ top:0px; } 50%{ top:-7px; } }
  @keyframes pgIn{ from{ opacity:0; transform:translateY(24px) scale(.98); } to{ opacity:1; transform:none; } }
  /* click ripple (same as the portfolio's .ripple) */
  .ripple{ position:absolute; z-index:7; border-radius:50%; background:rgba(19,185,253,0.35);
    transform:scale(0); animation:rippleAnim .6s ease-out forwards; pointer-events:none; }
  @keyframes rippleAnim{ to{ transform:scale(1); opacity:0; } }
  .pg.skeleton::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(100deg, transparent 20%, rgba(19,185,253,.10) 50%, transparent 80%);
    background-size:220% 100%; animation:shimmer 1.4s linear infinite;
  }
  @keyframes shimmer{ from{ background-position:120% 0; } to{ background-position:-120% 0; } }
  .dark-paper .pg{ background:#10161e; }
  .dark-paper .pg canvas{ filter:invert(.92) hue-rotate(180deg); }
  .dark-paper .textLayer mark{ background:rgba(255,205,40,.6); }

  /* PDF.js text layer: invisible, selectable text that carries the search highlights */
  .textLayer{ position:absolute; inset:0; overflow:hidden; line-height:1; text-size-adjust:none; forced-color-adjust:none; }
  .textLayer span, .textLayer br{ color:transparent; position:absolute; white-space:pre; cursor:text; transform-origin:0% 0%; }
  .textLayer ::selection{ background:rgba(19,185,253,.35); color:transparent; }
  .textLayer mark{ color:transparent; background:rgba(255,200,0,.42); border-radius:3px; box-shadow:0 0 0 1px rgba(255,170,0,.35); padding:0; }
  .textLayer mark.cur{ background:rgba(255,120,0,.55); box-shadow:0 0 0 2px #ff7a00, 0 0 14px rgba(255,122,0,.6); }
  .linkLayer{ position:absolute; inset:0; }
  .linkLayer a{ position:absolute; display:block; border-radius:3px; }
  .linkLayer a:hover{ background:rgba(19,185,253,.14); outline:1px solid rgba(19,185,253,.5); }

  .viewer-msg{ text-align:center; color:var(--ink-dim); font-size:14px; padding:26px 0; }

  .viewer-msg.err{ color:var(--amber); background:var(--surface); border:1px solid var(--surface-line); border-radius:12px; padding:16px 18px; margin:6px 0 18px; text-align:left; line-height:1.6; }
  .viewer-msg.err code{ font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--ink); }

  /* ---------- FOOTER ---------- */
  .r-footer{ position:relative; z-index:1; padding-block:36px 56px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px; }
  .r-footer .build-info{ font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--ink-faint); }
  .r-footer-actions{ display:flex; gap:10px; flex-wrap:wrap; }

  /* ---------- MOBILE ---------- */
  @media (max-width:640px){
    header{ position:static; }
    .rs-bar{ top:0; }
    .r-hero{ padding-block:28px 16px; }

    .rs-tools{ padding-top:12px; }

    nav{ flex-wrap:wrap; gap:12px 10px; }
    .nav-actions{ display:contents; }
    .logo{ order:1; margin-right:auto; }

    .nav-actions .btn{ order:3; align-self:stretch; flex:1 1 calc(50% - 5px); justify-content:center; text-align:center; white-space:normal; padding:11px 10px; }
    .nav-actions .btn-primary, .r-footer-actions .btn-primary{ border:1px solid transparent; }
    .r-footer{ padding-block:28px 48px; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:18px; }
    .r-footer-actions{ width:100%; justify-content:center; flex-wrap:nowrap; }
    .r-footer-actions .btn{ flex:1 1 0; min-width:0; justify-content:center; text-align:center; white-space:normal; padding:11px 10px; }
  }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
</style>

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---- Theme toggle (same sessionStorage key as the portfolio page) ----
(function(){
  const root = document.documentElement;
  const toggle = document.getElementById('themeToggle');
  function syncToggleUI(){
    const isLight = root.getAttribute('data-theme') === 'light';
    toggle.textContent = isLight ? '☀️' : '🌙';
    toggle.setAttribute('aria-label', isLight ? 'Switch to dark mode' : 'Switch to light mode');
  }
  syncToggleUI();
  toggle.addEventListener('click', () => {
    const isLight = root.getAttribute('data-theme') === 'light';
    if(isLight){ root.removeAttribute('data-theme'); try{ sessionStorage.setItem('theme','dark'); }catch(e){} }
    else{ root.setAttribute('data-theme','light'); try{ sessionStorage.setItem('theme','light'); }catch(e){} }
    syncToggleUI();
  });
})();

// ---- Back to Portfolio: go back in history when we came from the portfolio, so the scroll position is restored ----
['backToPortfolio', 'backToPortfolioFooter', 'logoBackLink'].forEach(id => {
  const el = document.getElementById(id);
  if(!el) return;
  el.addEventListener('click', (e) => {
    e.preventDefault();
    const href = el.getAttribute('href');
    let fromPortfolio = false;
    try{
      if (document.referrer) { const u = new URL(document.referrer); fromPortfolio = u.origin === location.origin && !/resume\.html$/.test(u.pathname); }
      else fromPortfolio = sessionStorage.getItem('fromPortfolio') === '1';
    }catch(_){}
    const go = () => {
      if (fromPortfolio && history.length > 1) { try{ sessionStorage.removeItem('fromPortfolio'); }catch(_){} history.back(); }
      else window.location.href = href;
    };
    if (reduceMotion) { go(); return; }
    document.body.classList.add('page-exit');
    setTimeout(go, 340);
  });
});
window.addEventListener('pageshow', () => { document.body.classList.remove('page-exit'); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) document.body.classList.remove('page-exit'); });

// ---- Keep the sticky search bar right under the (sticky) header ----
(function(){
  const h = document.getElementById('siteHeader');
  const set = () => document.documentElement.style.setProperty('--hdr-h', (getComputedStyle(h).position === 'sticky' ? h.offsetHeight : 0) + 'px');
  set(); window.addEventListener('resize', set); window.addEventListener('load', set);
  if (window.ResizeObserver) new ResizeObserver(set).observe(h);
})();

// ---- "Resume last updated": read the PDF's own Last-Modified date ----
(function(){
  const el = document.getElementById('lastUpdated');
  const fmt = d => d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  const fallback = () => { const d = new Date(document.lastModified); if(!isNaN(d)) el.textContent = fmt(d); };
  if (location.protocol === 'file:' || !window.fetch) { fallback(); return; }
  fetch('Abhishek_Kumar_Resume.pdf',{method:'HEAD',cache:'no-cache'}).then(r => {
    const m = r.headers.get('Last-Modified'); const d = m ? new Date(m) : null;
    if (d && !isNaN(d)) el.textContent = fmt(d); else fallback();
  }).catch(fallback);
})();

// ---- PDF viewer + search ----
(function(){
  const PDF_URL = 'Abhishek_Kumar_Resume.pdf';
  // PDF.js is loaded from your own site first (works offline and when opened from disk), then from CDNs.
  const LIBS = [
    { lib:'pdfjs/pdf.min.js', worker:'pdfjs/pdf.worker.min.js' },
    { lib:'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js', worker:'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js' },
    { lib:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js', worker:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js' }
  ];
  const $ = id => document.getElementById(id);
  const pagesEl = $('pages'), scrollEl = $('pagesScroll'), msg = $('viewerMsg');
  const input = $('rsInput'), countEl = $('rsCount'), prevBtn = $('rsPrev'), nextBtn = $('rsNext'), clearBtn = $('rsClear');
  const bar = $('rsBar'), body = document.body;
  let pdf = null, recs = [], zoom = 1, matches = [], cur = -1, query = '', lastW = 0, renderToken = 0;

  function loadScript(src){
    return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Could not load ' + src)); document.head.append(s); });
  }
  async function loadLib(){
    if (window.pdfjsLib && pdfjsLib.GlobalWorkerOptions.workerSrc) return;
    for (const l of LIBS){
      try{ await loadScript(l.lib); if (window.pdfjsLib){ pdfjsLib.GlobalWorkerOptions.workerSrc = l.worker; return; } }catch(e){ /* try the next source */ }
    }
    throw new Error('PDF.js could not be loaded');
  }
  async function openPdf(){
    try{ return await pdfjsLib.getDocument({ url: PDF_URL }).promise; }
    catch(err){
      // Browsers block reading a PDF from disk (file://) — use the bundled copy of the PDF data instead
      try{
        await loadScript('Abhishek_Kumar_Resume.pdf.js');
        const b64 = window.__RESUME_PDF_B64; if (!b64) throw err;
        const bin = atob(b64), u8 = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
        return await pdfjsLib.getDocument({ data: u8 }).promise;
      }catch(e2){ throw err; }
    }
  }
  function fail(err){
    document.documentElement.classList.add('use-fallback');
    msg.className = 'viewer-msg err'; msg.style.display = 'block';
    msg.innerHTML = '<b>Search couldn’t start.</b> The resume viewer files didn’t load, so the PDF is shown directly below — use your browser’s find (Ctrl/Cmd + F) to search it.<br>Make sure <code>Abhishek_Kumar_Resume.pdf</code>, the <code>pdfjs</code> folder and <code>Abhishek_Kumar_Resume.pdf.js</code> are uploaded in the same folder as <code>resume.html</code>.';
    input.disabled = true; input.placeholder = 'Search unavailable — see the note below';
    countEl.textContent = ''; document.querySelectorAll('.kchip, .zoom button, .paper-btn').forEach(b => b.disabled = true);
  }

  const fitWidth = () => {
    const v = scrollEl.parentElement, cs = getComputedStyle(v);
    const inner = v.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    return Math.max(260, Math.min(900, inner - 6));
  };

  async function load(){
    await loadLib();
    pdf = await openPdf();
    for (let n = 1; n <= pdf.numPages; n++){
      const page = await pdf.getPage(n);
      const textContent = await page.getTextContent();
      const items = textContent.items.filter(i => i.str !== undefined);
      const wrap = document.createElement('div'); wrap.className = 'pg skeleton';
      const canvas = document.createElement('canvas');
      const tl = document.createElement('div'); tl.className = 'textLayer';
      const ll = document.createElement('div'); ll.className = 'linkLayer';
      wrap.append(canvas, tl, ll);
      pagesEl.append(wrap);
      recs.push({ n, page, textContent, items, wrap, canvas, tl, ll, divs: [], touched: new Set() });
    }
    await renderAll();
    msg.style.display = 'none';
    const q = new URLSearchParams(location.search).get('q');
    if (q){ input.value = q; runSearch(true); }
  }

  async function renderAll(){
    const token = ++renderToken;
    const cssW = fitWidth() * zoom; lastW = fitWidth();
    pagesEl.style.width = cssW + 'px';
    for (const r of recs){ if (token !== renderToken) return; await renderPage(r, cssW); }
    if (token === renderToken && query) applyHighlights();
  }

  async function renderPage(r, cssW){
    const base = r.page.getViewport({ scale: 1 });
    const scale = cssW / base.width, vp = r.page.getViewport({ scale });
    let dpr = Math.min(window.devicePixelRatio || 1, 3);
    while (vp.width * vp.height * dpr * dpr > 36e6 && dpr > 1) dpr -= .5;
    r.canvas.width = Math.floor(vp.width * dpr); r.canvas.height = Math.floor(vp.height * dpr);
    r.canvas.style.width = vp.width + 'px'; r.canvas.style.height = vp.height + 'px';
    r.wrap.style.width = vp.width + 'px'; r.wrap.style.height = vp.height + 'px';
    const ctx = r.canvas.getContext('2d');
    await r.page.render({ canvasContext: ctx, viewport: vp, transform: dpr !== 1 ? [dpr,0,0,dpr,0,0] : null }).promise;
    r.wrap.classList.remove('skeleton');
    // text layer
    r.tl.textContent = ''; r.touched.clear(); r.divs = [];
    r.tl.style.setProperty('--scale-factor', scale);
    const strs = [];
    const task = pdfjsLib.renderTextLayer({ textContentSource: r.textContent, container: r.tl, viewport: vp, textDivs: r.divs, textContentItemsStr: strs });
    await task.promise;
    r.strs = strs;
    // clickable links from the PDF (Google Play / App Store / LinkedIn ...)
    r.ll.textContent = '';
    const annots = await r.page.getAnnotations();
    annots.forEach(a => {
      if (a.subtype !== 'Link' || !a.url) return;
      const [x1,y1,x2,y2] = vp.convertToViewportRectangle(a.rect);
      const el = document.createElement('a'); el.href = a.url; el.target = '_blank'; el.rel = 'noopener noreferrer';
      el.style.left = Math.min(x1,x2)+'px'; el.style.top = Math.min(y1,y2)+'px';
      el.style.width = Math.abs(x2-x1)+'px'; el.style.height = Math.abs(y2-y1)+'px';
      el.title = a.url; r.ll.append(el);
    });
  }

  // ---------- search ----------
  const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  function findMatches(q){
    const out = [];
    if (!q) return out;
    const re = new RegExp(esc(q.trim()).replace(/\s+/g, '\\s+'), 'gi');
    recs.forEach(r => {
      if (!r.strs) return;
      let full = '', map = [];
      r.strs.forEach((s, i) => {
        map.push({ i, s: full.length, e: full.length + s.length });
        full += s;
        if (r.items[i] && r.items[i].hasEOL) full += ' ';
      });
      let m; re.lastIndex = 0;
      while ((m = re.exec(full)) && m[0].length){
        const a = m.index, b = a + m[0].length, parts = [];
        map.forEach(x => { if (x.e > a && x.s < b && x.e > x.s) parts.push({ i: x.i, a: Math.max(a,x.s) - x.s, b: Math.min(b,x.e) - x.s }); });
        if (parts.length) out.push({ r, parts, marks: [] });
      }
    });
    return out;
  }

  function clearHighlights(){
    recs.forEach(r => { r.touched.forEach(i => { if (r.divs[i]) r.divs[i].textContent = r.strs[i]; }); r.touched.clear(); });
  }

  function applyHighlights(){
    clearHighlights();
    matches = findMatches(query);
    const byDiv = new Map();
    matches.forEach((m, k) => m.parts.forEach(p => { const key = m.r.n + ':' + p.i; if(!byDiv.has(key)) byDiv.set(key, { r: m.r, i: p.i, list: [] }); byDiv.get(key).list.push({ a: p.a, b: p.b, k }); }));
    byDiv.forEach(({ r, i, list }) => {
      const div = r.divs[i]; if (!div) return;
      const text = r.strs[i]; list.sort((x,y) => x.a - y.a);
      div.textContent = ''; let pos = 0;
      list.forEach(({ a, b, k }) => {
        if (a > pos) div.append(text.slice(pos, a));
        const mk = document.createElement('mark'); mk.textContent = text.slice(a, b); mk.dataset.k = k; div.append(mk); matches[k].marks.push(mk);
        pos = b;
      });
      if (pos < text.length) div.append(text.slice(pos));
      r.touched.add(i);
    });
    updateUI();
  }

  function updateUI(){
    const has = !!query;
    bar.classList.toggle('has-q', has); input.closest('.rs-field').classList.toggle('has-q', has);
    body.classList.toggle('has-q', has);
    document.querySelectorAll('.kchip').forEach(c => c.classList.toggle('on', has && c.dataset.q.toLowerCase() === query.trim().toLowerCase()));
    if (!has){ countEl.textContent = ''; countEl.classList.remove('none'); }
    else if (!matches.length){ countEl.textContent = 'No matches'; countEl.classList.add('none'); }
    else { countEl.classList.remove('none'); countEl.textContent = (cur + 1) + ' / ' + matches.length; }
    prevBtn.disabled = nextBtn.disabled = matches.length < 1;
  }

  function goTo(k, smooth){
    if (!matches.length) return;
    cur = (k + matches.length) % matches.length;
    document.querySelectorAll('mark.cur').forEach(m => m.classList.remove('cur'));
    const m = matches[cur]; m.marks.forEach(x => x.classList.add('cur'));
    updateUI();
    const el = m.marks[0]; if (!el) return;
    const barH = bar.getBoundingClientRect().bottom;                      // bottom edge of the sticky bar
    const rect = el.getBoundingClientRect();
    const target = window.scrollY + rect.top - Math.max(barH + 24, window.innerHeight * 0.38);
    window.scrollTo({ top: Math.max(0, target), behavior: (smooth === false || reduceMotion) ? 'auto' : 'smooth' });
    // wide (zoomed) pages: also bring the match into view horizontally
    const sr = scrollEl.getBoundingClientRect();
    if (rect.left < sr.left + 10 || rect.right > sr.right - 10) scrollEl.scrollTo({ left: scrollEl.scrollLeft + rect.left - sr.left - sr.width/3, behavior: 'smooth' });
  }

  function runSearch(jump){
    query = input.value.trim();
    cur = -1;
    if (!pdf || !recs.every(r => r.strs)) return;
    applyHighlights();
    if (matches.length && jump !== false) goTo(0);
  }

  let deb; input.addEventListener('input', () => { clearTimeout(deb); deb = setTimeout(runSearch, 140); });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter'){ e.preventDefault(); clearTimeout(deb); if (input.value.trim() !== query){ runSearch(); } else if (matches.length){ goTo(cur + (e.shiftKey ? -1 : 1)); } }
    else if (e.key === 'Escape'){ input.value = ''; runSearch(false); }
  });
  nextBtn.addEventListener('click', () => goTo(cur + 1));
  prevBtn.addEventListener('click', () => goTo(cur - 1));
  clearBtn.addEventListener('click', () => { input.value = ''; runSearch(false); input.focus(); });
  document.querySelectorAll('.kchip').forEach(c => c.addEventListener('click', () => {
    const same = query.toLowerCase() === c.dataset.q.toLowerCase();
    input.value = same ? '' : c.dataset.q; runSearch(!same);
  }));
  document.addEventListener('keydown', e => { if (e.key === '/' && !/^(INPUT|TEXTAREA)$/.test((document.activeElement||{}).tagName)){ e.preventDefault(); input.focus(); input.select(); } });

  // ---------- same 3D tilt + glow-follow + ripple as the portfolio cards ----------
  const CAN_TILT = window.matchMedia('(hover:hover) and (pointer:fine)');
  pagesEl.addEventListener('mousemove', e => {
    const card = e.target.closest && e.target.closest('.pg'); if (!card) return;
    if (!CAN_TILT.matches){ if (card.style.transform) card.style.transform = ''; return; }
    const rect = card.getBoundingClientRect(), x = e.clientX - rect.left, y = e.clientY - rect.top;
    const rotateX = ((y - rect.height / 2) / (rect.height / 2)) * -5, rotateY = ((x - rect.width / 2) / (rect.width / 2)) * 5;
    card.style.transform = `perspective(700px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-4px)`;
    card.style.setProperty('--mx', `${(x / rect.width) * 100}%`);
    card.style.setProperty('--my', `${(y / rect.height) * 100}%`);
  });
  pagesEl.addEventListener('mouseout', e => {
    const card = e.target.closest && e.target.closest('.pg');
    if (card && !card.contains(e.relatedTarget)) card.style.transform = '';
  });
  pagesEl.addEventListener('click', e => {
    const card = e.target.closest && e.target.closest('.pg'); if (!card || reduceMotion) return;
    const r = card.getBoundingClientRect(), size = Math.max(r.width, r.height) * 1.2;
    const rp = document.createElement('span'); rp.className = 'ripple';
    rp.style.width = rp.style.height = size + 'px';
    rp.style.left = (e.clientX - r.left - size / 2) + 'px'; rp.style.top = (e.clientY - r.top - size / 2) + 'px';
    card.appendChild(rp); setTimeout(() => rp.remove(), 650);
  });

  // ---------- zoom / paper ----------
  const zOut = $('zOut'), zIn = $('zIn'), zVal = $('zVal');
  function setZoom(z){ zoom = Math.max(.6, Math.min(2, Math.round(z * 100) / 100)); zVal.textContent = Math.round(zoom * 100) + '%'; zOut.disabled = zoom <= .6; zIn.disabled = zoom >= 2; renderAll(); }
  zOut.addEventListener('click', () => setZoom(zoom - .2)); zIn.addEventListener('click', () => setZoom(zoom + .2));
  zVal.addEventListener('click', () => setZoom(1)); zVal.style.cursor = 'pointer'; zVal.title = 'Reset zoom';
  const paperBtn = $('paperBtn');
  function setPaper(on){ document.documentElement.classList.toggle('dark-paper', on); paperBtn.setAttribute('aria-pressed', on); paperBtn.textContent = on ? '☀ Original paper' : '🌙 Dark paper'; try{ sessionStorage.setItem('paper', on ? 'dark' : 'light'); }catch(e){} }
  paperBtn.addEventListener('click', () => setPaper(!document.documentElement.classList.contains('dark-paper')));
  try{ if (sessionStorage.getItem('paper') === 'dark') setPaper(true); }catch(e){}

  // re-render when the available width changes (rotate / resize)
  let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (recs.length && Math.abs(fitWidth() - lastW) > 4) renderAll(); }, 220); });

  window.__resumeViewer = { get matches(){ return matches; }, get cur(){ return cur; }, get recs(){ return recs; }, runSearch };
  load().catch(err => { console.error('Resume viewer:', err); fail(err); });
})();
</script>
